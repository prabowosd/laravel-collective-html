name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Only the PHP versions each Laravel release supports.
        include:
          - { laravel: '6', php: '8.0' }
          - { laravel: '7', php: '8.0' }
          - { laravel: '8', php: '8.0' }
          - { laravel: '8', php: '8.1' }
          - { laravel: '9', php: '8.0' }
          - { laravel: '9', php: '8.1' }
          - { laravel: '9', php: '8.2' }
          - { laravel: '10', php: '8.1' }
          - { laravel: '10', php: '8.2' }
          - { laravel: '10', php: '8.3' }
          - { laravel: '11', php: '8.2' }
          - { laravel: '11', php: '8.3' }
          - { laravel: '11', php: '8.4' }
          - { laravel: '11', php: '8.5' }
          - { laravel: '12', php: '8.2' }
          - { laravel: '12', php: '8.3' }
          - { laravel: '12', php: '8.4' }
          - { laravel: '12', php: '8.5' }
          - { laravel: '13', php: '8.3' }
          - { laravel: '13', php: '8.4' }
          - { laravel: '13', php: '8.5' }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/routing:^${{ matrix.laravel }}.0" \
            "illuminate/session:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/view:^${{ matrix.laravel }}.0"
          composer require --dev --no-update --no-interaction "illuminate/database:^${{ matrix.laravel }}.0"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: |
          # PHPUnit 9 (PHP 8.0) does not read the PHPUnit 10+ config.
          if vendor/bin/phpunit --version | grep -q 'PHPUnit 9'; then
            vendor/bin/phpunit --configuration phpunit.legacy.xml
          else
            vendor/bin/phpunit
          fi

      - name: Check code style
        if: matrix.php == '8.5' && matrix.laravel == '13'
        run: vendor/bin/pint --test
