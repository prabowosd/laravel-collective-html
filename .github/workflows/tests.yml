name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['10', '11', '12', '13']
        exclude:
          - { php: '8.2', laravel: '13' }
          - { php: '8.4', laravel: '10' }
          - { php: '8.5', laravel: '10' }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/routing:^${{ matrix.laravel }}.0" \
            "illuminate/session:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/view:^${{ matrix.laravel }}.0"
          composer require --dev --no-update --no-interaction "illuminate/database:^${{ matrix.laravel }}.0"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Check code style
        if: matrix.php == '8.5' && matrix.laravel == '13'
        run: vendor/bin/pint --test
